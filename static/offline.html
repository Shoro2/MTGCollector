<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Offline · MTG Collector</title>
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<style>
			:root { color-scheme: dark; }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0e15; color: #e7edf5; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
			main { max-width: 26rem; margin: 1rem; padding: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; background: #101722; }
			h1 { margin: 0 0 0.5rem; font-size: 1.2rem; color: #f3f7fb; }
			p { margin: 0 0 1rem; color: #8a97a8; }
			a.button { display: inline-block; padding: 0.55rem 1rem; border-radius: 8px; background: #2f6fe0; color: #fff; text-decoration: none; }
			a.button:focus-visible { outline: 2px solid #6fb2ff; outline-offset: 2px; }
			button { margin-left: 0.5rem; padding: 0.5rem 0.9rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.14); background: transparent; color: #e7edf5; font: inherit; cursor: pointer; }
		</style>
	</head>
	<body>
		<main>
			<h1>You are offline</h1>
			<p>This page needs a connection. The card scanner works without one when offline mode is turned on: captures are saved on this device and identified once you are back online.</p>
			<a class="button" href="/scan">Open the scanner</a>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
